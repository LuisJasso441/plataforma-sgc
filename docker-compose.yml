services:
  web:
    build: .
    container_name: sga_web
    ports:
      - "8090:80"          # navegas en http://localhost:8090
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: sga_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sga
      MYSQL_USER: sga_user
      MYSQL_PASSWORD: sga_pass
    volumes:
      - sga_db_data:/var/lib/mysql
    ports:
      - "3307:3306"        # 3307 afuera para no chocar con otro MySQL/MariaDB

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sga_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8091:80"          # phpMyAdmin en http://localhost:8091
    depends_on:
      - db

volumes:
  sga_db_data: